      <mat-expansion-panel-header>{{ROLE_OFFICER}}s</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-users-table [role]="ROLE_OFFICER"></app-users-table>
      </div>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>{{ROLE_SECTION_LEADER}}s</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-users-table [role]="ROLE_SECTION_LEADER"></app-users-table>
      </div>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>{{ROLE_ATTENDANCE_TAKER}}s</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-users-table [role]="ROLE_ATTENDANCE_TAKER"></app-users-table>
      </div>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>Other Leadership</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-users-table [role]="ROLE_LEADERSHIP"></app-users-table>
      </div>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>{{ROLE_MEMBER}}s</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-users-table [role]="ROLE_MEMBER"></app-users-table>
      </div>
    </mat-expansion-panel>
  </mat-accordion><br/>
  <div style="display: flex; flex-direction: row; justify-content: space-between;">

      <button mat-flat-button color="primary" (click)="openUserDialog()">Add User</button>&nbsp;&nbsp;

      <!--            Assign User to Role-->

    </div>

<!--      Upload Roles CSV-->
<!--    </button>-->
  </div>
</div>

<ng-template #addUserDialog>
  <h2 mat-dialog-title>Add User</h2>
  <form #userForm="ngForm" (ngSubmit)="submitUser(userForm)">
    <mat-dialog-content>
      <mat-form-field>
        <mat-label class="form-label">Email</mat-label>
        <input matInput id="userEmail" type="text" name="userEmail" [(ngModel)]="userEmail">
      </mat-form-field><br/>
      <mat-form-field>
        <mat-label class="form-label">First Name</mat-label>
        <input matInput id="userFirstName" type="text" name="userFirstName" [(ngModel)]="userFirstName">
      </mat-form-field><br/>
      <mat-form-field>
        <mat-label class="form-label">Last Name</mat-label>
        <input matInput id="userLastName" type="text" name="userLastName" [(ngModel)]="userLastName">
      </mat-form-field><br/>
      <mat-form-field>
        <mat-label class="form-label">Role</mat-label>
        <mat-select id="userRole" name="userRole" [(ngModel)]="userRole">
          <mat-option [value]="null">--</mat-option>
          <mat-option *ngFor="let option of userRoleOptions" [value]="option">{{option}}</mat-option>
        </mat-select>
      </mat-form-field><br/>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancelDialog()">Cancel</button>
      <button mat-button type="submit" [disabled]="!userEmail || !userFirstName || !userLastName || !userRole">Submit</button>
    </mat-dialog-actions>
  </form>
</ng-template>

<ng-template #missingEmailsConfirmationDialog>
  <h2 mat-dialog-title>The following emails are not associated with a user:</h2>
  <mat-dialog-content>
    <ul>
      <li *ngFor="let email of emailsMissingUsers">{{ email }}</li>
    </ul>
    <span style="color:black">Proceed and skip these emails?</span>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="closeDialogAndClearEmails()">Cancel</button>&nbsp;
    <button mat-button (click)="uploadFile()">Proceed</button>
  </mat-dialog-actions>
</ng-template>
