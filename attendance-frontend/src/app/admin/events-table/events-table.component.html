<div class="mat-elevation-z4">
  <table mat-table [dataSource]="eventDataSource">

    <!-- Title Column -->
    <ng-container matColumnDef="event">
      <th mat-header-cell *matHeaderCellDef> Event </th>
      <td mat-cell *matCellDef="let event"> {{event.title}} </td>
    </ng-container>

    <!-- Pep Band Column -->
    <ng-container matColumnDef="pepBand">
      <th mat-header-cell *matHeaderCellDef> Pep Band </th>
      <td mat-cell *matCellDef="let event"> {{Utilities.getPepBandLabel(event.pepBandId)}} </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let event"> {{event.date | date: 'EEEE, MMMM d h:mm a' }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="eventColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: eventColumns;"></tr>
  </table>
  <mat-paginator #eventPaginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page">
  </mat-paginator>
</div><br/>
<button mat-flat-button color="primary" (click)="openEventDialog()">Create Event</button>

<ng-template #createEventDialog>
  <h2 mat-dialog-title>Create Event</h2>
  <form #eventForm="ngForm" (ngSubmit)="submitEvent(eventForm)">
    <mat-dialog-content>
      <div style="display: flex; flex-direction: column">
        <mat-form-field>
          <mat-label class="form-label">Title</mat-label>
          <input matInput id="eventTitle" type="text" name="eventTitle" [(ngModel)]="eventTitle">
        </mat-form-field>
        <mat-form-field>
          <mat-label class="form-label">Type</mat-label>
          <mat-select id="eventType" name="eventType" [(ngModel)]="eventType">
            <mat-option [value]="null">--</mat-option>
            <mat-option *ngFor="let option of eventTypeOptions" [value]="option">{{option}}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field *ngIf="eventType === EVENT_TYPE_PEP_EVENT">
          <mat-label class="form-label">Pep Band</mat-label>
          <mat-select id="eventPepBand" name="eventPepBand" [(ngModel)]="eventPepBand">
            <mat-option [value]="null">--</mat-option>
            <mat-option *ngFor="let option of pepBandOptions" [value]="option">{{option.displayName}}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field>
          <mat-label class="form-label">Event Date</mat-label>
          <input matInput [matDatepicker]="eventPicker" name="eventDate" [(ngModel)]="eventDate">
          <mat-datepicker-toggle matIconSuffix [for]="eventPicker"></mat-datepicker-toggle>
          <mat-datepicker #eventPicker></mat-datepicker>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Event time</mat-label>
          <input matInput type="time" name="eventTime"
                 [(ngModel)]="eventTime">
        </mat-form-field>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancelDialog()">Cancel</button>
      <button mat-button type="submit">Submit</button>
    </mat-dialog-actions>
  </form>
</ng-template>
