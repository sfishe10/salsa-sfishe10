<div class="mat-elevation-z4">
  <table mat-table [dataSource]="userDataSource" [fixedLayout]="true">

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let user"> {{user.email}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let user"> {{user.lastName}}, {{user.firstName}} </td>
    </ng-container>

    <!-- Role Column -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let user"> {{user.role}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: userColumns;"></tr>
  </table>
  <mat-paginator #userPaginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page">
  </mat-paginator>
</div><br/>
<button mat-flat-button color="primary" (click)="openUserDialog()">Add User</button>

<ng-template #addUserDialog>
  <h2 mat-dialog-title>Add User</h2>
  <form #userForm="ngForm" (ngSubmit)="submitUser(userForm)">
    <mat-dialog-content>
      <mat-form-field>
        <mat-label class="form-label">Email</mat-label>
        <input matInput id="userEmail" type="text" name="userEmail" [(ngModel)]="userEmail">
      </mat-form-field><br/>
      <mat-form-field>
        <mat-label class="form-label">First Name</mat-label>
        <input matInput id="userFirstName" type="text" name="userFirstName" [(ngModel)]="userFirstName">
      </mat-form-field><br/>
      <mat-form-field>
        <mat-label class="form-label">Last Name</mat-label>
        <input matInput id="userLastName" type="text" name="userLastName" [(ngModel)]="userLastName">
      </mat-form-field><br/>
      <mat-form-field>
        <mat-label class="form-label">Role</mat-label>
        <mat-select id="userRole" name="userRole" [(ngModel)]="userRole">
          <mat-option [value]="null">--</mat-option>
          <mat-option *ngFor="let option of userRoleOptions" [value]="option">{{option}}</mat-option>
        </mat-select>
      </mat-form-field><br/>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancelDialog()">Cancel</button>
      <button mat-button type="submit">Submit</button>
    </mat-dialog-actions>
  </form>
</ng-template>
