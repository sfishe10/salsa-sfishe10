<div class="mat-elevation-z4">
  <table mat-table [dataSource]="userDataSource" [fixedLayout]="true">

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let user"> {{user.email}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let user"> {{user.lastName}}, {{user.firstName}} </td>
    </ng-container>

    <!-- Role Column -->
    <ng-container *ngIf="!role" matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let user"> {{user.role}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
    <tr mat-row (click)="navigateToUser(row.userId)" class="clickable-row" *matRowDef="let row; columns: userColumns;"></tr>
  </table>
  <mat-paginator #userPaginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page">
  </mat-paginator>
</div>
