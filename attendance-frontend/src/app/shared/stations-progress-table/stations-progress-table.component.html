<div *ngIf="!dataSource || dataSource.length == 0">
  <span>No evaluation records found.</span>
</div>

<div *ngIf="dataSource && dataSource.length > 0" style="overflow-x: auto; max-height: 80vh; max-width: 100%;" class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" multiTemplateDataRows style="width: 100%;">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="header-cell"></th>

      <td mat-cell *matCellDef="let row; let i = index"
          class="name-cell">
        {{ row.fullName }}
      </td>
    </ng-container>

    <!-- Section Column-->
    <ng-container matColumnDef="section">
      <th mat-header-cell *matHeaderCellDef class="header-cell"></th>

      <td mat-cell *matCellDef="let row; let i = index" [attr.colspan]="displayedColumns.length"
          class="section-row-cell">
        {{ row.sectionName }}
      </td>
    </ng-container>

    <!-- Status Columns -->
    <ng-container *ngFor="let station of stations" [matColumnDef]="station.stationId.toString()">
      <th mat-header-cell *matHeaderCellDef class="header-cell">
        {{ station.level + 1 }}
      </th>
      <td mat-cell *matCellDef="let row; let i = index"
          class="status-cell"
          [ngClass]="{ 'section-row-cell': isSectionRow(i, row) }"
          [ngStyle]="
            !isSectionRow(i, row) ?
            {'background-color': 'var(--' + Utilities.getStationStatusColor(row.stationsMap[station.stationId]?.status) + '-color)'} : null
          ">
        <span *ngIf="!isSectionRow(i, row)">
          <span *ngIf="row.stationsMap[station.stationId]?.attemptCount == 0">-</span>
          <span *ngIf="row.stationsMap[station.stationId]?.attemptCount > 0">[{{row.stationsMap[station.stationId]?.attemptCount}}]</span>
        </span>
      </td>
    </ng-container>

    <!-- Header Row -->
    <tr mat-header-row class="stations-row" *matHeaderRowDef="displayedColumns"></tr>

    <!-- Section Row -->
    <tr mat-row class="section-row" *matRowDef="let row; columns: ['section']; when: isSectionRow"></tr>

    <!-- Member Row -->
    <tr mat-row class="member-row" *matRowDef="let row; columns: displayedColumns; when: isMemberRow"></tr>
  </table>
</div>
