<div class="mat-elevation-z4">
  <table mat-table [dataSource]="attendanceDataSource">

    <!-- Title Column -->
    <ng-container matColumnDef="event">
      <th mat-header-cell *matHeaderCellDef> Event </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventTitle}} </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventDate | date: 'EEEE, MMMM d h:mm a' }} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.attendanceStatus}} </td>
    </ng-container>

    <!-- Subbed By Column -->
    <ng-container matColumnDef="subbedBy">
      <th mat-header-cell *matHeaderCellDef> Subbed By </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.subFirstName}} {{attendance.subLastName}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="attendanceColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: attendanceColumns;"></tr>
  </table>
  <mat-paginator #attendancePaginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page">
  </mat-paginator>
</div>
