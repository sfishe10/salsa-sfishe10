<div *ngIf="stationsLoaded && !stations.length">
  <div>
    <span style="color: red; font-size: .9rem">No stations found.</span>
  </div><br/>
</div>
<div class="mat-elevation-z4">
  <table mat-table [dataSource]="stationsDataSource">

    <!-- Rank Column -->
    <ng-container matColumnDef="rank">
      <td mat-cell *matCellDef="let station"> {{station.level + 1}} </td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <td mat-cell *matCellDef="let station"> {{station.title}} </td>
    </ng-container>

    <tr (click)="navigateToStation(row.stationId)" class="clickable-row" mat-row *matRowDef="let row; columns: stationsColumns;"></tr>
  </table>
</div>
