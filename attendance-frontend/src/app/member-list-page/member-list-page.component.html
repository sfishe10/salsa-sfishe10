<p *ngIf="membersLoaded && !sectionMemberMap.size">No members found.</p>

<div *ngIf="membersLoaded && sectionMemberMap.size" class="container">
  <div *ngFor="let section of sectionMemberMap.keys()" class="table-container">
    <table class="mat-elevation-z4" mat-table [dataSource]="sectionMemberMap.get(section) ?? []">
      <ng-container matColumnDef="section">
        <th mat-header-cell *matHeaderCellDef>{{section}}</th>
        <td mat-cell
            *matCellDef="let member"
            (click)="startEvaluation(member.memberId)">{{member.user.firstName}} {{member.user.lastName}}</td>
      </ng-container>

      <tr mat-header-row class="section-row" *matHeaderRowDef="['section']"></tr>
      <tr mat-row class="member-row" *matRowDef="let row; columns: ['section'];"></tr>
    </table>
  </div>

</div>
