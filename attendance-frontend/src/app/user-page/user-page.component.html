<div *ngIf="sessionCacheService.isOfficer() || sessionCacheService.isAdmin() || sessionCacheService.isSectionLeader()">
  <form #userForm="ngForm" (ngSubmit)="updateUser(userForm)">
    <div style="display: flex; align-items: start; justify-content: space-between">
      <div *ngIf="!editing" style="display: flex; flex-direction: column; gap: 10px; font-size: 1.2rem">
        <span>Email: <b>{{user?.email}}</b></span>
        <span>First Name: <b>{{user?.firstName}}</b></span>
        <span>Last Name: <b>{{user?.lastName}}</b></span>
        <span>Role: <b>{{user?.role}}</b></span>
      </div>


      <div *ngIf="editing">
        <div style="display: flex; flex-direction: column">
          <mat-form-field style="max-width: 400px">
            <mat-label class="form-label">Email</mat-label>
            <input matInput id="email" type="text" name="email" [(ngModel)]="email">
          </mat-form-field>
          <mat-form-field style="max-width: 400px">
            <mat-label class="form-label">First Name</mat-label>
            <input matInput id="firstName" type="text" name="firstName" [(ngModel)]="firstName">
          </mat-form-field>
          <mat-form-field style="max-width: 400px">
            <mat-label class="form-label">Last Name</mat-label>
            <input matInput id="lastName" type="text" name="lastName" [(ngModel)]="lastName">
          </mat-form-field>
          <mat-form-field style="max-width: 400px">
            <mat-label class="form-label">Role</mat-label>
            <mat-select id="role" name="role" [(ngModel)]="role">
              <mat-option *ngFor="let option of roleOptions" [value]="option">{{option}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <button style="margin-top: 10px;"
                mat-flat-button
                color="warn"
                type="button"
                (click)="openConfirmationDialog()">Delete User</button>&nbsp;
      </div>

      <div>
        <button *ngIf="!editing && canEdit" mat-flat-button type="button" color="primary"  (click)="edit()">Edit</button>
        <div *ngIf="editing" class="actions">
          <button mat-flat-button type="submit" color="primary">Save</button>
          <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        </div>
      </div>
    </div>


    <button *ngIf="!editing"
            type="button"
            (click)="goBack()"
            mat-flat-button
            style="background-color: lightgray; margin-top: 20px;">Back</button>
  </form>
</div>


<ng-template #confirmDeleteDialog>
  <h2 mat-dialog-title>Delete User?</h2>
  <mat-dialog-content>
    <span style="color: red">WARNING: This will delete all associated records for this user.</span>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="cancelDialog()">Cancel</button>
    <button mat-button (click)="deleteUser()">Delete</button>
  </mat-dialog-actions>
</ng-template>

<ng-template #successDialog>
  <h2 mat-dialog-title>User successfully deleted!</h2>
  <mat-dialog-actions align="end">
    <button mat-button (click)="goBack()">Ok</button>
  </mat-dialog-actions>
</ng-template>
