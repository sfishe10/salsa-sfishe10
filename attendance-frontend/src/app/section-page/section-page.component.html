<div>
  <div *ngIf="allowSectionSelection" class="section-name">
<!--    <span *ngIf="!allowSectionSelection"-->
<!--          style="margin-left: 10px; font-size: 1.4rem;"><b>{{selectedSection?.name}}</b></span>-->
    <mat-form-field subscriptSizing="dynamic">
      <mat-label class="form-label">Select Section</mat-label>
      <mat-select [(ngModel)]="selectedSection" (selectionChange)="onSectionChange($event.value)">
        <mat-option *ngFor="let option of sectionOptions" [value]="option">{{option.name}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

<!--  <mat-divider *ngIf="allowSectionSelection" style="margin-bottom: 10px"></mat-divider>-->
  <div>
    <mat-tab-group *ngIf="pepBands.length" style="margin-bottom: 10px">
      <mat-tab *ngFor="let pepBand of pepBands" [label]="pepBand.displayName">
        <div *ngIf="pepBand.members.length" class="mat-elevation-z4" style="margin: 5px;">
          <table mat-table [dataSource]="pepBand.members">

            <!-- Email Column -->
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> Email </th>
              <td mat-cell *matCellDef="let member"> {{member.user.email}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Name </th>
              <td mat-cell *matCellDef="let member"> {{member.user.firstName}} {{member.user.lastName}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="memberColumns" style="height: 2rem"></tr>
            <tr (click)="navigateToMember(row.memberId)" class="clickable-row" mat-row *matRowDef="let row; columns: memberColumns;"></tr>
          </table>
        </div>
        <div *ngIf="!pepBand.members.length" style="margin-top: 20px; margin-bottom: 10px; width: 100%; display: flex; justify-content: center">
          No members assigned to {{pepBand.displayName}}.
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>

  <div style="padding-top:5px; padding-bottom: 20px;">
    <app-attendance-stats-table
      [termId]="term.termId"
      [sectionId]="sectionId"
      (rowClicked)="navigateToMember($event)"></app-attendance-stats-table>
  </div>

  <mat-accordion multi>
    <mat-expansion-panel>
      <mat-expansion-panel-header>Rehearsal Attendances</mat-expansion-panel-header>
      <app-attendance-table [termId]="term.termId" [eventType]="EVENT_TYPE_REHEARSAL" [sectionId]="sectionId"></app-attendance-table>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>Whole Band Event Attendances</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-attendance-table [termId]="term.termId" [eventType]="EVENT_TYPE_WHOLE_BAND_EVENT" [sectionId]="sectionId"></app-attendance-table>
      </div>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>Pep Event Attendances</mat-expansion-panel-header>
      <div style="padding-top:5px">
        <app-attendance-table [termId]="term.termId" [eventType]="EVENT_TYPE_PEP_EVENT" [sectionId]="sectionId"></app-attendance-table>
      </div>
    </mat-expansion-panel>
<!--    <mat-expansion-panel>-->
<!--      <mat-expansion-panel-header>Volunteer Event Attendances</mat-expansion-panel-header>-->

<!--    </mat-expansion-panel>-->
  </mat-accordion>

</div>
