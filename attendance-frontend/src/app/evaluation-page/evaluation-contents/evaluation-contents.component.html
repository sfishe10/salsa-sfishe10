<div *ngIf="evaluation" class="container">
  <div *ngFor="let group of groupedItems" class="table-container">
    <table class="mat-elevation-z4" mat-table [dataSource]="group[1]">
      <ng-container matColumnDef="stationGroup">
        <th mat-header-cell *matHeaderCellDef>{{group[0]}}</th>
        <td mat-cell *matCellDef="let item">
          <div class="item-row-contents">
            <span>{{item.stationItem.item}}</span>
            <mat-slide-toggle [disabled]="readonly"></mat-slide-toggle>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row class="group-title-row" *matHeaderRowDef="['stationGroup']"></tr>
      <tr mat-row class="item-row" *matRowDef="let row; columns: ['stationGroup'];"></tr>
    </table>
  </div>

</div>
