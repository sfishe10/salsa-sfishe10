<mat-sidenav-container style="height:100%">
  <mat-sidenav #sidenav [mode]="'over'" class="navbar">
    <button mat-icon-button (click)="sidenav.toggle()"><mat-icon>menu</mat-icon></button>
    <a routerLink="/upcoming-events" (click)="sidenav.toggle()">Upcoming Events</a>
    <a routerLink="/recent-events" (click)="sidenav.toggle()">Recent Events</a>
    <a routerLink="/profile" (click)="sidenav.toggle()">Profile</a>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar style="padding-left:0">
      <button mat-icon-button (click)="sidenav.toggle()"><mat-icon>menu</mat-icon></button>
      <span *ngIf="router.url === '/upcoming-events'" class="app-title">Upcoming Events</span>
      <span *ngIf="router.url === '/recent-events'" class="app-title">Recent Events</span>
      <span *ngIf="router.url === '/profile'" class="app-title">Profile</span>
      <span *ngIf="router.url.includes('/attendance-form')" class="app-title">Enter Attendance</span>
    </mat-toolbar>
    <mat-divider></mat-divider>
    <div class="main-container">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
