<div class="container" cdkDropListGroup [ngStyle]="{'cursor': editing ? 'move' : 'default'}">
  <div *ngFor="let group of station?.groups; index as i" style="margin-bottom: 20px;">
    <div class="item-box" style="background-color: var(--primary-color); color: white; border-bottom: 0">{{group.title}}</div>

    <div *ngIf="!editing" class="list">
      <div *ngFor="let item of group.items" class="item-box">
        <span>{{item.item}}</span>
      </div>
    </div>

    <div *ngIf="editing" cdkDropList
         [cdkDropListData]="group.items"
         (cdkDropListDropped)="drop($event)"
         class="list">
      <div *ngFor="let item of group.items" class="item-box" cdkDrag>
        <span>{{item.item}}</span>
      </div>
    </div>

  </div>
</div>
