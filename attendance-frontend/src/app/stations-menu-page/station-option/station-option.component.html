<div class="container">
  <mat-card (click)="navigateToAction()">
    <mat-card-header>
      <mat-card-title><b style="color: #feedc8">{{option.split(' ')[0]}}</b><span style="font-weight: lighter;">&nbsp;{{option.split(' ').slice(1).join(' ')}}</span></mat-card-title>
      <mat-icon class="material-symbols-outlined">arrow_right_alt</mat-icon>
    </mat-card-header>
  </mat-card>
</div>
